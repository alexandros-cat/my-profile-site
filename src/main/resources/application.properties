spring.application.name=springboot-application

# 環境変数からURLや認証情報を取得するようにする（未設定時はローカル用を使用）
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://db:5432/dev}
spring.datasource.username=${JDBC_DATABASE_USERNAME:postgres}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true