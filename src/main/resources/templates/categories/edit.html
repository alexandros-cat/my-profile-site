<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>skill-edit</title>
    <!-- 自作のCSSファイルのみでデザインする場合 -->
    <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="top-page">
  <!-- ヘッダー -->
  <header class="header">
    <div class="header-inner">
      <h1 class="header-title">My Portfolio</h1>
      <form th:action="@{/logout}" method="post">
        <button type="submit" class="header_btn">ログアウト</button>
      </form>    
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="main-skill-container">
    <div class="month-selector-wrapper">
      <form th:action="@{/categories/edit}" method="get">
        <select class="month-selector" id="month-selector" name="month" onchange="this.form.submit()">
        </select>
      </form>
        <script>
         const select = document.getElementById('month-selector');
          const now = new Date();
          const currentYear = now.getFullYear();
          const currentMonth = now.getMonth() + 1;

          // URLから現在選択されている月を取得する（なければ今月）
          const urlParams = new URLSearchParams(window.location.search);
          const selectedMonth = urlParams.get('month') ? parseInt(urlParams.get('month')) : currentMonth;
          
          // 過去3ヶ月分を安全に生成
          for (let i = 2; i >= 0; i--) {
              let d = new Date(currentYear, currentMonth - 1 - i, 1);
              let targetMonth = d.getMonth() + 1; 
              let targetYear = d.getFullYear();   

              let option = document.createElement("option");
              option.setAttribute("value", targetMonth);
              option.innerHTML = targetMonth + "月";

              if (targetMonth === selectedMonth) {  
                  option.setAttribute("selected", "selected"); 
              }

              select.appendChild(option);
          }
        </script>
        
    </div>
    <div class="categories-wrapper">

      <!-- バックエンド -->
      <div class="categories-item">
        <div class="categories-item-inner">
          <div class="categories-item-inner-header">  
            <div class="categories-item-inner-title">バックエンド</div>
            <a th:href="@{/categories/add(categoryId=1, month=${param.month != null ? param.month[0] : ''})}" class="add-item-btn">項目を追加する</a>
          </div>  
          
          <!-- スクロールするコンテナの中にヘッダーもデータも一緒に入れる -->
          <div class="table-scroll-container">
            <table class="categories-item-inner-table"> 
              <!-- ヘッダー行 -->
              <tr>
                <th class="th-box"><span class="item-name">項目名</span></th>
                <th class="th-box study-hours-th"><span class="study-hours">学習時間</span></th>
                <th class="th-box"></th>
                <th class="th-box"></th>
              </tr>
              <!-- データ行 -->
              <tr class="table-row" th:each="learning_data:${backend_data}">
                  <td class="item-name-add" th:text="${learning_data.studyItem}"></td>
                  <td class="study-hours-add">
                    <input type="number" min="0" step="1" value="0" id="study_time" th:value="${learning_data.studyTime}">
                  </td>
                  <td class="study-hours-record">
                      <button type="submit" class="save_btn">学習時間を保存する</button>
                  </td>
                  <td class="item-name-delete">
                    <button type="submit" class="delete_btn">削除する</button>
                  </td>
              </tr>    
            </table>
          </div>

        </div>
      </div>

      <!-- フロントエンド -->
      <div class="categories-item">
        <div class="categories-item-inner">
          <div class="categories-item-inner-header">  
            <div class="categories-item-inner-title">フロントエンド</div>
            <a th:href="@{/categories/add(categoryId=2, month=${param.month != null ? param.month[0] : ''})}" class="add-item-btn">項目を追加する</a>
          </div>  
         
          <!-- スクロールするコンテナの中にヘッダーもデータも一緒に入れる -->
          <div class="table-scroll-container">
            <table class="categories-item-inner-table">
              <!-- ヘッダー行 -->
              <tr>
                <th class="th-box"><span class="item-name">項目名</span></th>
                <th class="th-box study-hours-th"><span class="study-hours">学習時間</span></th>
                <th class="th-box"></th>
                <th class="th-box"></th>
              </tr>
              <!-- データ行 -->
              <tr class="table-row" th:each="learning_data:${frontend_data}">
                  <td class="item-name-add" th:text="${learning_data.studyItem}"></td>
                  <td class="study-hours-add">
                    <input type="number" min="0" step="1" value="0" id="study_time" th:value="${learning_data.studyTime}">
                  </td>
                  <td class="study-hours-record">
                      <button type="submit" class="save_btn">学習時間を保存する</button>
                  </td>
                  <td class="item-name-delete">
                    <button type="submit" class="delete_btn">削除する</button>
                  </td>
              </tr>      
            </table>
          </div>

        </div>
      </div>

      <!-- インフラ -->
      <div class="categories-item">
        <div class="categories-item-inner">
          <div class="categories-item-inner-header">  
            <div class="categories-item-inner-title">インフラ</div>
            <a th:href="@{/categories/add(categoryId=3, month=${param.month != null ? param.month[0] : ''})}" class="add-item-btn">項目を追加する</a>
          </div>  
          
          <!-- スクロールするコンテナの中にヘッダーもデータも一緒に入れる -->
          <div class="table-scroll-container">
            <table class="categories-item-inner-table">
              <!-- ヘッダー行 -->
              <tr>
                <th class="th-box"><span class="item-name">項目名</span></th> 
                <th class="th-box study-hours-th"><span class="study-hours">学習時間</span></th>
                <th class="th-box"></th>
                <th class="th-box"></th>
              </tr> 
              <!-- データ行 -->
              <tr class="table-row" th:each="learning_data:${infra_data}">
                <td class="item-name-add" th:text="${learning_data.studyItem}"></td>
                <td class="study-hours-add">
                  <input type="number" min="0" step="1" value="0" id="study_time" th:value="${learning_data.studyTime}">
                </td>
                <td class="study-hours-record">
                  <button type="submit" class="save_btn">学習時間を保存する</button>
                </td>
                <td class="item-name-delete">
                  <button type="submit" class="delete_btn">削除する</button>
                </td>
              </tr>        
            </table>
          </div>

        </div>
      </div>

    </div>
  </main>

  <!-- フッター -->
  <footer class="footer">   
    <div class="footer-inner">
      <h5 class="footer-title">portfolio site</h5>
    </div>
  </footer>
</body>
</html>
