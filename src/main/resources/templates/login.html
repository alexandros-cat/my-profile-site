<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>login</title>
    <!-- 自作のCSSファイルのみでデザインする場合 -->
    <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="login-page">
  <!-- ヘッダー -->
  <header class="header">
    <div class="header-inner">
      <h1 class="header-title">My Portfolio</h1>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="main-container">
    <div class="form-wrapper">
      <h2 class="main-title">ログイン</h2>
      <p th:if="${errorMessage}" th:text="${errorMessage}" class="error-message"></p>
      <form th:action="@{/login}" method="post" th:object="${login}" class="signup-form">  
        
        <!-- メールアドレス -->
        <div class="form-group">
          <label for="email">メールアドレス</label>
          <input type="email" id="email" th:field="*{email}" />
          <p th:errors="*{email}" class="error-message"></p>
        </div>

        <!-- パスワード -->
        <div class="form-group">
          <label for="password">パスワード</label>
          <input type="password" id="password" th:field="*{password}" />
          <p th:errors="*{password}" class="error-message"></p>
        </div>

        <!-- ログインボタン -->
        <button type="submit" class="submit-btn">ログインする</button>
      </form>  
        <!-- 登録ボタン --> 
      <button type="button" class="submit-btn" onclick="location.href='/users/register'">新規登録する</button>
    </div>  
  </main>

  <!-- フッター -->
  <footer class="footer">
    <div class="footer-inner">
      <h5 class="footer-title">portfolio site</h5>
    </div>
  </footer>   
</body>
</html>
