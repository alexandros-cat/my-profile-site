<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>top page</title>
    <!-- 自作のCSSファイルのみでデザインする場合 -->
    <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="top-page">
  <!-- ヘッダー -->
  <header class="header">
    <div class="header-inner">
      <h1 class="header-title">My Portfolio</h1>
      <form th:action="@{/logout}" method="post">
        <button type="submit" class="header_btn">ログアウト</button>
      </form>    
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="profile-container">
    <div class="form-wrapper">
      <!-- プロフィールセクション -->
      <section class="profile-section">
        <!-- プロフィールセクション -->
        <div class="profile-user">
          <div class="profile-icon">
            <img th:if="${user.avatarImage != null and user.avatarImage != ''}" th:src="@{${user.avatarImage}}" />
          </div>
          <div class="profile-name-box">
            <span th:text="${user.name}">ユーザー名</span>
          </div>    
        </div>
         <!-- 自己紹介セクション -->
        <div class="profile-about">
          <h2 class="profile-title">自己紹介</h2>
          <p class="profile-text" th:text="${user.profile}"></p>
            <!-- <button type="button" class="profile-btn" onclick="location.href='/users/edit'">自己紹介を編集する</button> -->
            <button type="button" class="profile-btn" th:onclick="|location.href='@{/users/edit(id=${user.id})}'|">自己紹介を編集する</button>
          <!-- </form> -->
        </div>
      </section>
     <!-- チャートセクション -->
      <div class="chart-wrapper">
       <section class="chart-section">
         <h2 class="study-chart">学習チャート</h2>
         <button type="button" class="chart-edit-btn" onclick="location.href='categories/edit'">編集する</button>
       </section>     
       <!-- チャート領域のコンテナ -->
       <div id="learningChart">
         <canvas id="myBarChart"></canvas>
       </div>
     </div>
    </div>   
  </main>
    
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.7.2/Chart.bundle.js"></script>
 <script type="text/javascript" th:inline="javascript">
  // コントローラーから渡された label と data を受け取る
  var label = /*[[${label}]]*/ ["先々月", "先月", "今月"];
  var backend = /*[[${backendData}]]*/ [0, 0, 0];
  var frontend = /*[[${frontendData}]]*/ [0, 0, 0];
  var infra = /*[[${infraData}]]*/ [0, 0, 0];
  
  var ctx = document.getElementById("myBarChart");
  var myBarChart = new Chart(ctx, {
    type: 'bar',
    data: {
     //凡例のラベル
     labels: label,
      datasets: [
        {
          label: 'バックエンド', //データ項目のラベル
          data: backend, //グラフのデータ
          backgroundColor: "#F8C8DC",
        },{
          label: 'フロントエンド', //データ項目のラベル
          data: frontend, //グラフのデータ
          backgroundColor: "#FFE4B5",
        },{
          label: 'インフラ', //データ項目のラベル
          data: infra, //グラフのデータ
          backgroundColor: "#FFD75E",
        }
      ]
    },
    options: {
      title: {
        display: true,
        //グラフタイトル
        text: 'chart.js Bar chart'
      },
      scales: {
        yAxes: [{
          ticks: {
            suggestedMax: 250, //最大値
            suggestedMin: 0, //最小値
            stepSize: 50, //縦ラベルの数値単位
            }
        }]
      },
    }
  });
</script>

  <!-- フッター -->
  <footer class="footer">   
    <div class="footer-inner">
      <h5 class="footer-title">portfolio site</h5>
    </div>
  </footer>
</body>
</html>
