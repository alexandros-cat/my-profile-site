services:
  app:
    build:
      context: ./
      dockerfile: Dockerfile
    working_dir: /app
    ports:
      - 8080:8080 
      - 5050:5050
    env_file:
      - .env
    depends_on:
      - db   # ← ここをハイフン付きのリスト形式にする

  db:
    image: postgres:14.5-alpine
    container_name: db
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: "dev"
    ports:
      - "5432:5432"